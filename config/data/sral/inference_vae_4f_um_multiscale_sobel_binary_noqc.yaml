# Data information for online satellite assimilation into NEMO restarts.
# NoQC variant: no AMSR2 -> model quantile mapping at inference.
dataset_name: 'Fields3DVARDS'
transform_name: 'vae'
assimilation_range: 3
add_gauss: False

ass_data: 'sral'

back_field: ['siconc', 'sithic', 'sitemp', 'sosstsst']
indxs: [0, 1, 2, 8]
means: [0.5, 0.5, -3, 3.0]
stds: [0.5, 0.5, 0.5, 5.0]
padding: [0.0, 0.0, -1., 0.0]

sral_indx: 11

val_source: ['amsr2', 'sral']
val_field: [['siconc'], ['siconc']]

mask_path: '/path/to/vae-mda-data/static/land_mask.npy'
