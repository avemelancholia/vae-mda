# Loss-weight selection on the 60 development dates (Supplementary Note on loss-weight selection).
# For each model and experiment, every (w_b, w_z) pair below is fitted on these dates with the base config;
# w_y stays at 1 (M2M) or 6 (S2M). M2M selects the highest mean skill over the fields a model decodes,
# against the following-year NEMO field; S2M selects the highest combined skill (dense AMSR2 and sparse
# SRAL-conditioned AMSR2). Run with scripts/select_loss_weights.py.
# Ten dates per month, January-June 2022 (Supplementary Table S5).
dates: ['2022-01-01', '2022-01-04', '2022-01-08', '2022-01-11', '2022-01-14', '2022-01-18', '2022-01-21', '2022-01-24',
